storage:
  base_path: "/tmp/labdata"
  users_path: "/tmp/labdata/users"
  groups_path: "/tmp/labdata/groups"
  sessions_path: "/srv/labdata/sessions"
  public_path: "/tmp/labdata/public"
  # group_folder_type determines whether the groups folder in the Samba share
  # exposes accounts, projects, or nested hierarchical folders at the top level.
  # Options: "project" (default), "account", or "hierarchical".
  # This choice is locked at initial deployment.
  group_folder_type: "account"

  # Exclusions: Skip creating group folders and Linux groups for certain NEMO accounts/projects
  # (e.g. system projects or policy accounts like "Administration" or "Buddy" that do not need storage).
  exclude_project_ids: []
  exclude_account_ids: []
  exclude_project_names: ["Buddy"]
  exclude_account_names: ["Administration"]


mtls:
  enabled: false
  ca_cert: "certs/ca.crt"
  server_cert: "certs/server.crt"
  server_key: "certs/server.key"

quota:
  default_soft: 10  # GB
  default_hard: 12  # GB

session:
  db_path: "/var/lib/lab-daemon/state.db"  # SQLite Database
  socket_path: "/var/run/lab-daemon/lab-daemon.sock"  # Unix Socket
  idle_timeout_minutes: 60
  unmount_grace_seconds: 30

nemo:
  django_path: "/opt/nemo-ce"
  poll_interval_seconds: 3600
  use_api_http: true
  api_url: "http://localhost:8000"
  api_token: "7bcbd57d7c8161e65d458dd8c1ae10d3118c7e98"

sync:
  on_deactivation: "lock_account"  # lock_account | remove_membership_only | ignore
  dry_run: false
